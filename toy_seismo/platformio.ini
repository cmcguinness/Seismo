; Sunton / DIYmalls ESP32-8048S050C-I -- 5.0" 800x480 IPS, GT911 capacitive touch.
;
; Board definitions come from ./boards (rzeldent/platformio-espressif32-sunton),
; cloned rather than vendored -- see README.md.
;
[env:esp32-8048S050C]
; MUST be version-pinned: pioarduino installs itself under the bare name
; "espressif32", so an unpinned line silently resolves to whatever is installed.
platform = espressif32@6.9.0
board = esp32-8048S050C
framework = arduino

; must run before anything compiles -- see the script's docstring
extra_scripts = pre:scripts/clean_host_env.py

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

build_flags =
    -Ofast
    -Wall
    '-D BOARD_NAME="${this.board}"'
    '-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO'
    ; no inner quotes: lv_conf_internal.h stringifies this itself via __LV_TO_STR
    '-D LV_CONF_PATH=${platformio.include_dir}/lv_conf.h'
    '-D LVGL_BUFFER_PIXELS=(DISPLAY_WIDTH*40)'
    '-D LVGL_BUFFER_MALLOC_FLAGS=(MALLOC_CAP_INTERNAL|MALLOC_CAP_DMA)'
    ; PCLK stays at the board default 16 MHz (~39 Hz refresh). Dropping it to
    ; 8.2 MHz for a 20 Hz refresh made the panel free-run and cycle colours:
    ; the ST7262 has a MINIMUM pixel clock (~10-14 MHz) below which its timing
    ; controller loses lock. If scanout bandwidth ever needs cutting again,
    ; 12 MHz is the lowest worth trying, and it must be verified on the panel.

; Version-matched set, do not loosen any of the three:
;   * library from git (2.1.1). The REGISTRY's "3.0.0" is a bad publish -- it
;     expects GPIO_BCKL, while every boards commit including the one the library
;     itself pins defines DISPLAY_BCKL, and it also uses `uint` and sw_rotate.
;   * platform = espressif32 -> Arduino 2.0.17 / IDF 4.4, which still has
;     esp_lcd_rgb_panel_config_t.{psram_trans_align,on_frame_trans_done,user_ctx}.
;     Newer pioarduino/IDF 5.5 removed those and 2.1.1 will not compile there.
;   * LVGL pinned to 9.2.2, the version this driver is written against.
; ./boards is pinned to 05e8c10e, the commit the library's own submodule uses.
; esp32_smartdisplay is VENDORED in lib/ (2.1.1, commit 456360c) rather than
; pulled by URL: PlatformIO's git-client check fails here, and vendoring pins
; the exact source that matches ./boards @ 05e8c10e.
; The board JSON puts LVGL's draw buffer in PSRAM at FULL SCREEN size (768 KB).
; That makes every render read+write the same slow memory the panel scanout is
; reading, which is what produces residual desync spikes. A partial buffer in
; internal SRAM renders in fast memory and only the finished strip crosses to
; PSRAM. 800 x 40 x 2 = 64 KB, against ~160 KB of free internal heap.
build_unflags =
    '-D LVGL_BUFFER_PIXELS=(DISPLAY_WIDTH*DISPLAY_HEIGHT)'
    '-D LVGL_BUFFER_MALLOC_FLAGS=(MALLOC_CAP_SPIRAM|MALLOC_CAP_8BIT)'

lib_deps = lvgl/lvgl@9.2.2
